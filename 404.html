<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>页面跳转中...</title>
    <script>
      // 获取当前路径，去掉 base 前缀，重定向到 index.html
      var path = window.location.pathname.replace(/\/business-card-template\/.*/, '/business-card-template/')
      window.location.href = path + '?redirect=' + encodeURIComponent(window.location.pathname)
    </script>
  </head>
  <body>
    <p>页面跳转中，请稍候...</p>
  </body>
</html>
